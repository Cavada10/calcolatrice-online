<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navale Arena - Gaming Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col h-screen w-screen items-center justify-center bg-[#0b0f19] p-4">
    <div class="w-full max-w-[450px] bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-4">
            <h1 class="text-sm font-black text-cyan-400">🚢 10. BATTAGLIA NAVALE 10x10</h1>
            <a href="index.html" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl font-bold">⬅️ HUB</a>
        </div>
        <div id="status" class="text-[11px] font-mono mb-4 text-center text-gray-400">Clicca sul quadrante nemico per lanciare i siluri</div>
        <div id="grid" class="grid grid-cols-10 gap-1 w-full aspect-square bg-slate-950 p-2 rounded-xl"></div>
    </div>
    <script>
        let enemy = Array(10).fill().map(()=>Array(10).fill(0)), hits=0;
        for(let i=0; i<8; i++) enemy[Math.floor(Math.random()*10)][Math.floor(Math.random()*10)] = 1; // Posiziona navi randomiche silenziate
        const grid = document.getElementById('grid');
        for(let r=0; r<10; r++) {
            for(let c=0; c<10; c++) {
                let cell = document.createElement('button'); cell.className = "bg-slate-800 rounded-sm hover:bg-slate-700 transition";
                cell.onclick = () => {
                    if(cell.innerText!=="") return;
                    if(enemy[r][c] === 1) { cell.innerText="💥"; cell.className="bg-red-950 text-red-500 rounded-sm font-bold"; hits++; if(hits>=8) alert("VITTORIA! Flotta nemica rasa al suolo."); }
                    else { cell.innerText="💧"; cell.className="bg-blue-950 text-blue-400 rounded-sm"; }
                }; grid.appendChild(cell);
            }
        }
    </script>
</body>
</html>
