<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impiccato - Gaming Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col h-screen w-screen items-center justify-center bg-[#0b0f19] p-4">
    <div class="w-full max-w-[420px] bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-4">
            <h1 class="text-lg font-black text-red-500">🪓 7. L'IMPICCATO</h1>
            <a href="index.html" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl font-bold">⬅️ HUB</a>
        </div>
        <div id="secret-setup" class="w-full flex flex-col space-y-2 mb-4">
            <input type="password" id="secret-word" class="bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-xs" placeholder="Player A: inserisci Parola Segreta...">
            <button onclick="setWord()" class="bg-red-600 py-1.5 rounded-xl text-xs font-bold uppercase">Blocca Parola</button>
        </div>
        <div id="game-zone" class="hidden w-full text-center space-y-4">
            <div id="word-display" class="text-3xl font-mono tracking-widest text-cyan-400 font-black">_ _ _</div>
            <div id="errors" class="text-xs text-red-400 font-bold">Errori: 0 / 6</div>
            <div class="flex space-x-2">
                <input type="text" id="letter-in" maxlength="1" class="w-12 bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold">
                <button onclick="guessLetter()" class="flex-1 bg-slate-800 rounded-xl text-xs font-bold uppercase">Tenta Lettera</button>
            </div>
        </div>
    </div>
    <script>
        let word='', guessed=[], errors=0;
        function setWord() {
            word = document.getElementById('secret-word').value.trim().toUpperCase(); if(word.length<2) return;
            guessed = Array(word.length).fill('_'); document.getElementById('secret-setup').classList.add('hidden');
            document.getElementById('game-zone').classList.remove('hidden'); updateUI();
        }
        function guessLetter() {
            let l = document.getElementById('letter-in').value.toUpperCase(); document.getElementById('letter-in').value=''; if(!l) return;
            if(word.includes(l)) { for(let i=0; i<word.length; i++) { if(word[i]===l) guessed[i]=l; } } 
            else { errors++; } updateUI();
            if(!guessed.includes('_')) { alert("P2 INDOVINA! VINCE IL MATCH."); reset(); }
            if(errors >= 6) { alert(`IMPICCATO! Vince Player A. La parola era: ${word}`); reset(); }
        }
        function updateUI() { document.getElementById('word-display').innerText = guessed.join(' '); document.getElementById('errors').innerText = `Errori: ${errors} / 6`; }
        function reset() { location.reload(); }
    </script>
</body>
</html>
