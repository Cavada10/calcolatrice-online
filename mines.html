<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine - Gaming Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col h-screen w-screen items-center justify-center bg-[#0b0f19] p-4">
    <div class="w-full max-w-[420px] bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-4">
            <h1 class="text-lg font-black text-red-500">💣 3. MINE ROULETTE</h1>
            <a href="index.html" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl font-bold">⬅️ HUB</a>
        </div>
        <div id="t-disp" class="text-xs font-bold text-blue-400 mb-4 bg-slate-950 p-2 rounded-full w-full text-center border border-slate-800">Turno: GIOCATORE 1</div>
        <div id="grid" class="grid grid-cols-5 gap-2 w-full aspect-square mb-4"></div>
        <button onclick="reset()" class="w-full py-2 bg-slate-800 rounded-xl text-xs font-bold">RESET AREA</button>
    </div>
    <script>
        let turn=1, active=true, mine=Math.floor(Math.random()*25), grid=document.getElementById('grid');
        function init() {
            grid.innerHTML = '';
            for(let i=0; i<25; i++) {
                let btn = document.createElement('button');
                btn.className = "bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700/20";
                btn.onclick = () => {
                    if(!active || btn.innerText!=="") return;
                    if(i === mine) { btn.innerText="💥"; btn.className="bg-red-600 rounded-xl text-xl"; document.getElementById('t-disp').innerText=`GIOCATORE ${turn===1?2:1} HA VINTO IL DUCCIO!`; active=false; }
                    else { btn.innerText="🍃"; btn.className="bg-emerald-950/40 text-emerald-400 rounded-xl border border-emerald-900/40"; turn=turn===1?2:1; document.getElementById('t-disp').innerText=`Turno: GIOCATORE ${turn}`; }
                };
                grid.appendChild(btn);
            }
        }
        function reset() { turn=1; active=true; mine=Math.floor(Math.random()*25); document.getElementById('t-disp').innerText="Turno: GIOCATORE 1"; init(); }
        init();
    </script>
</body>
</html>
