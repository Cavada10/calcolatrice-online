<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Letter - Gaming Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col h-screen w-screen items-center justify-center bg-[#0b0f19] p-4">
    <div class="w-full max-w-[420px] bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-4">
            <h1 class="text-lg font-black text-amber-500">⏱️ 4. SPEED LETTER</h1>
            <a href="index.html" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl font-bold">⬅️ HUB</a>
        </div>
        <div id="letter-box" class="text-5xl font-black my-4 text-cyan-400 bg-slate-950 p-6 rounded-2xl border border-slate-800 w-full text-center">A</div>
        <div id="timer" class="text-lg font-mono font-bold text-red-500 mb-4">Tempo: 10s</div>
        <div class="w-full flex space-x-2">
            <input type="text" id="word-in" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-center font-bold outline-none" placeholder="Scrivi una parola...">
            <button onclick="submitWord()" class="bg-amber-600 px-4 rounded-xl font-black text-xs uppercase">Invia</button>
        </div>
    </div>
    <script>
        const letters = "ABCDEFGHILMNOPQRSTUV"; let currentLet = 'A', time=10, maxTime=10, loop;
        function nextTurn() {
            clearInterval(loop); currentLet = letters[Math.floor(Math.random()*letters.length)];
            document.getElementById('letter-box').innerText = currentLet;
            time = maxTime; document.getElementById('timer').innerText = `Tempo: ${time}s`;
            loop = setInterval(() => {
                time--; document.getElementById('timer').innerText = `Tempo: ${time}s`;
                if(time<=0) { clearInterval(loop); alert("TEMPO SCADUTO! Hai perso il match."); }
            }, 1000);
        }
        function submitWord() {
            let val = document.getElementById('word-in').value.trim().toUpperCase();
            if(val.startsWith(currentLet) && val.length > 2) {
                if(maxTime > 3) maxTime--; // Riduce il timer ad ogni turno per aumentare la difficoltà
                document.getElementById('word-in').value = ''; nextTurn();
            } else { alert("Parola non valida o troppo corta!"); }
        }
        nextTurn();
    </script>
</body>
</html>
